/* Layout idea: one phone-shaped column. Plum night outside, a bright cartoon juice bar inside. Neutral cream around every colour swatch so mixes read true. Single theme by choice. */
:root{
  color-scheme: dark;
  --plum:#2a1b4d;      /* page, outlines */
  --plum2:#3b2a6b;     /* panels on plum */
  --cream:#fff6e3;     /* cards, neutral ground */
  --ink:#2a1b4d;       /* text on cream */
  --pink:#ff5d8f;      /* primary action */
  --coin:#ffc93c;      /* coins, stars */
  --muted:#b9add8;
  --font:"Fredoka","Trebuchet MS","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;margin:0}
body{background:var(--plum);color:#fff;font-family:var(--font);font-size:16px;font-weight:500;overflow:hidden;
  background-image:radial-gradient(circle at 15% 0%,#46308a 0,transparent 50%),radial-gradient(circle at 100% 100%,#3a2470 0,transparent 45%)}
#app{height:100%;max-width:480px;margin:0 auto;padding:8px 16px 10px;display:flex;flex-direction:column;gap:8px}
header{display:flex;align-items:center;justify-content:space-between;gap:.3em;font-size:min(16px,3.55vw)}
.hud{display:flex;align-items:center;gap:.4em;font-variant-numeric:tabular-nums}
.pill{background:var(--plum2);border-radius:999px;padding:.3em .7em;font-weight:700;font-size:1em;display:flex;align-items:center;gap:.35em;white-space:nowrap}
.pill small{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.coin{width:14px;height:14px;border-radius:50%;background:var(--coin);border:2px solid #b98314;display:inline-block}
#hearts{color:#ff6b8f;letter-spacing:1px;font-size:1.05em}
#hearts .off{color:#5a478f}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--coin);outline-offset:2px}
.ghost{white-space:nowrap;background:var(--plum2);border:0;border-radius:999px;padding:.4em .75em;font-weight:600;font-size:.88em}
.ghost:active{background:#4b3888}
#stage{flex:1;min-height:0;position:relative;display:grid;place-items:center}
#wrap{position:relative;line-height:0}
canvas{display:block;border-radius:22px;touch-action:none;cursor:pointer;background:var(--cream);box-shadow:0 8px 0 #1c1136}
.overlay{position:absolute;inset:0;border-radius:22px;background:rgba(42,27,77,.86);display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:12px;padding:22px;line-height:1.35;overflow:auto}
.overlay[hidden]{display:none}
.overlay h1,.overlay h2{margin:0;font-weight:700;line-height:1.02;text-wrap:balance}
.overlay h1{font-size:44px}
.overlay h1 span{color:var(--coin)}
.overlay h2{font-size:34px}
.overlay p{margin:0;font-size:17px;color:#e9e2fb;max-width:30ch}
.steps{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none;font-size:16px;color:#e9e2fb}
.steps b{color:var(--coin)}
.primary{background:var(--pink);color:#fff;border:0;border-radius:16px;padding:12px 24px;font-weight:700;font-size:22px;box-shadow:0 5px 0 #b93462}
.primary:active{transform:translateY(3px);box-shadow:0 2px 0 #b93462}
.stars{font-size:46px;letter-spacing:6px;color:#5a478f;line-height:1}
.stars b{color:var(--coin);font-weight:500}
.tipcard{background:var(--cream);color:var(--ink);border-radius:14px;padding:10px 14px;font-size:16px;font-weight:600;max-width:32ch}
.tipcard small{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#8a6fd0;font-weight:700}
#modal{position:fixed;inset:0;background:rgba(16,8,36,.75);display:grid;place-items:center;padding:16px;z-index:5}
#modal[hidden]{display:none}
.sheet{background:var(--cream);color:var(--ink);border-radius:20px;max-width:460px;width:100%;max-height:100%;display:flex;flex-direction:column}
.sheet header{padding:14px 18px 8px}
.sheet h2{margin:0;font-size:24px;font-weight:700}
.sheet header{font-size:16px}.sheet .ghost{background:#eadfc6;color:var(--ink)}
.sheet .body{overflow:auto;padding:6px 18px 18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.rec{display:flex;align-items:center;gap:10px;background:#fff;border-radius:12px;padding:8px 10px;line-height:1.2;font-size:14px}
.rec i{width:34px;height:34px;border-radius:50%;border:3px solid var(--ink);flex:none;display:grid;place-items:center;font-style:normal;font-weight:700}
.rec b{display:block;font-size:16px;font-weight:700}
.rec.lock{opacity:.6}
.rec.lock i{background:#ddd3bd;border-style:dashed}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="hud">
      <div class="pill"><small>Day</small><span id="day">1</span></div>
      <div class="pill"><span class="coin"></span><span id="coins">0</span></div>
      <div class="pill" id="hearts" aria-label="Lives">♥♥♥</div>
    </div>
    <div class="hud">
      <button class="ghost" id="book" type="button">Recipes</button>
      <button class="ghost" id="sound" type="button" aria-pressed="false">Mute</button>
    </div>
  </header>

  <div id="stage">
    <div id="wrap">
      <canvas id="cv" width="420" height="720" aria-label="Juice bar. Tap fruit to fill the glass, then tap a monster to serve it."></canvas>

      <div class="overlay" id="menu">
        <h1>Monster <span>Juice Bar</span></h1>
        <p>Thirsty monsters want juice in their favourite colour. Mix it before they get grumpy.</p>
        <ul class="steps">
          <li><b>1.</b> Tap fruit to squirt juice into the glass.</li>
          <li><b>2.</b> Match the colour in the monster's bubble.</li>
          <li><b>3.</b> Tap the monster to serve.</li>
        </ul>
        <button class="primary" id="play" type="button">Open the bar</button>
      </div>

      <div class="overlay" id="dayEnd" hidden>
        <h2 id="endTitle">Day 1 done</h2>
        <div class="stars" id="stars"></div>
        <p id="endLine"></p>
        <div class="tipcard" id="endTip"></div>
        <button class="primary" id="nextDay" type="button">Next day</button>
      </div>

      <div class="overlay" id="over" hidden>
        <h2>Too many grumpy monsters</h2>
        <p id="overLine"></p>
        <button class="primary" id="retry" type="button">Try the day again</button>
      </div>
    </div>
  </div>
</div>

<div id="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="bookTitle">
    <header><h2 id="bookTitle">Recipe book</h2><button class="ghost" id="closeBook" type="button">Close</button></header>
    <div class="body" id="bookBody"></div>
  </div>
</div>

<script>
(() => {
'use strict';
const W = 420, H = 720, CY = 318, SLOT = [75, 210, 345], BTN_Y = 632, BTN_R = 42;
const GL = {x:210, top:396, h:150, wt:118, wb:88};       // the mixing glass
const PLUM = '#2a1b4d';
const CUBE = { // red-yellow-blue paint cube: what the three juices make together
  '000':[1,1,1], '100':[.96,.2,.22], '010':[1,.85,.1], '001':[.14,.42,.95],
  '110':[1,.52,.05], '101':[.56,.22,.78], '011':[.18,.72,.3], '111':[.42,.24,.12]
};
const ING = {
  R:{c:CUBE['100'], name:'red', x:60, key:'1'},
  Y:{c:CUBE['010'], name:'yellow', x:160, key:'2'},
  B:{c:CUBE['001'], name:'blue', x:260, key:'3'},
  W:{c:[1,1,1], name:'milk', x:360, key:'4'}
};
const RECIPES = [
  ['red','Strawberry Red',{R:1},1], ['yellow','Lemon Yellow',{Y:1},1], ['blue','Blueberry Blue',{B:1},1],
  ['orange','Orange',{R:1,Y:1},2], ['green','Green',{Y:1,B:1},2], ['purple','Purple',{R:1,B:1},2],
  ['pink','Pink',{R:1,W:1},3], ['sky','Sky Blue',{B:1,W:1},3], ['cream','Cream',{Y:1,W:1},3],
  ['peach','Peach',{R:1,Y:1,W:1},4], ['mint','Mint',{Y:1,B:1,W:1},4], ['lilac','Lilac',{R:1,B:1,W:1},4],
  ['vermilion','Red-Orange',{R:2,Y:1},5], ['amber','Amber',{R:1,Y:2},5], ['lime','Lime',{Y:2,B:1},5],
  ['teal','Teal',{Y:1,B:2},5], ['magenta','Magenta',{R:2,B:1},5], ['indigo','Indigo',{R:1,B:2},5],
  ['brown','Chocolate Brown',{R:1,Y:1,B:1},6]
].map(r => ({id:r[0], name:r[1], m:Object.assign({R:0,Y:0,B:0,W:0}, r[2]), day:r[3]}));
const TIPS = {
  1:'Tap a fruit to fill the glass. Then tap the monster to serve.',
  2:'Mix two fruits to make a new colour.',
  3:'Milk has arrived. It makes any colour lighter.',
  4:'Try three things in one glass.',
  5:'Amounts matter. Two squirts of one fruit and one of another make an in-between colour.',
  6:'All three fruits together make brown.',
  7:'Rush hour. The monsters are in a hurry now.'
};
const BODY = [[.56,.42,.94],[1,.56,.7],[.37,.82,.65],[1,.7,.28],[.36,.72,.96],[.97,.43,.43],[.62,.85,.3]];

const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const css = c => 'rgb(' + c.map(v => Math.round(Math.max(0, Math.min(1, v)) * 255)).join(',') + ')';
const lerp = (a, b, k) => a.map((v, i) => v + (b[i] - v) * k);
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const gcd = (a, b) => b ? gcd(b, a % b) : a;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

function mixColor(m) {
  const tot = m.R + m.Y + m.B + m.W; if (!tot) return null;
  const mx = Math.max(m.R, m.Y, m.B); let c = [1, 1, 1];
  if (mx) {
    const r = m.R / mx, y = m.Y / mx, b = m.B / mx; c = [0, 0, 0];
    for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) for (let k = 0; k < 2; k++) {
      const w = (i ? r : 1 - r) * (j ? y : 1 - y) * (k ? b : 1 - b), q = CUBE['' + i + j + k];
      c[0] += q[0] * w; c[1] += q[1] * w; c[2] += q[2] * w;
    }
  }
  if (m.W) { const k = Math.min(.85, m.W / tot * 1.15); c = c.map(v => v + (1 - v) * k); }
  return c;
}
function keyOf(m) { const g = [m.R, m.Y, m.B, m.W].reduce(gcd) || 1; return [m.R, m.Y, m.B, m.W].map(v => v / g).join('-'); }
function recipeText(m) {
  const parts = ['R','Y','B','W'].filter(k => m[k]), ones = parts.every(k => m[k] === 1);
  return parts.map(k => (ones ? '' : m[k] + ' ') + ING[k].name).join(' + ');
}
RECIPES.forEach(r => { r.col = mixColor(r.m); r.key = keyOf(r.m); });

// ---------- saved progress (this browser only) ----------
let S = {coins:0, maxDay:1, seen:{}, found:[]};
try { Object.assign(S, JSON.parse(localStorage.getItem('mjb.v1') || '{}')); } catch (e) {}
const save = () => { try { localStorage.setItem('mjb.v1', JSON.stringify(S)); } catch (e) {} };

// ---------- state ----------
let state = 'menu', paused = false, T = 0, scale = 1, muted = false;
let day = S.maxDay, hearts = 3, streak = 0, dayCoins = 0, missed = 0;
let N = 0, spawned = 0, done = 0, spawnT = 0, closing = 0, tipT = 0, tipText = '';
let monsters = [], drops = [], parts = [], floats = [], flies = [];
let glass = {R:0, Y:0, B:0, W:0, seq:[], col:[1,1,1], level:0, wob:0};
let press = {}, deny = 0;

// ---------- sound ----------
let ac = null;
function wake() { try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); } catch (e) {} }
function tone(f, d, type, v, delay, f2) {
  if (muted || !ac) return;
  try {
    const o = ac.createOscillator(), g = ac.createGain(), s = ac.currentTime + (delay || 0);
    o.type = type || 'sine'; o.frequency.setValueAtTime(f, s); if (f2) o.frequency.exponentialRampToValueAtTime(f2, s + d);
    g.gain.setValueAtTime(v || .07, s); g.gain.exponentialRampToValueAtTime(.0001, s + d);
    o.connect(g); g.connect(ac.destination); o.start(s); o.stop(s + d + .02);
  } catch (e) {}
}

// ---------- day setup ----------
function cfg(d) {
  return {n:Math.min(6 + d * 2, 22), patience:Math.max(8, 21 - d * 1.6), gap:Math.max(1.5, 4.6 - d * .35), slots:d === 1 ? 2 : 3};
}
function newMonster(slot, rec) {
  return {slot, x:SLOT[slot], rec, pat:1, patMax:1, state:'in', t:0, ph:rnd(0, 6), yuck:0, blink:rnd(1, 4),
    col:pick(BODY), w:rnd(90, 108), h:rnd(116, 138), top:Math.floor(rnd(0, 4)), eyes:pick([1, 2, 2, 2, 3]),
    teeth:Math.random() < .5, spots:Math.random() < .5, hint:(S.seen[rec.id] || 0) < 2, juice:null, frozen:false};
}
function pickRecipe() {
  const pool = RECIPES.filter(r => r.day <= day), fresh = pool.filter(r => r.day === Math.min(day, 6));
  return (day <= 6 && Math.random() < .55) ? pick(fresh) : pick(pool);
}
function spawn() {
  const c = cfg(day), busy = monsters.map(m => m.slot), free = [];
  for (let i = 0; i < 3; i++) if (!busy.includes(i) && (c.slots === 3 || i !== 1 || true)) free.push(i);
  if (monsters.length >= c.slots || !free.length) return;
  const rec = (day === 1 && spawned === 0) ? RECIPES[0] : pickRecipe();
  const m = newMonster(day === 1 && spawned === 0 ? 1 : pick(free), rec);
  m.patMax = m.pat = c.patience; m.frozen = day === 1 && spawned === 0;
  S.seen[rec.id] = (S.seen[rec.id] || 0) + 1;
  monsters.push(m); spawned++; spawnT = c.gap;
  tone(300, .12, 'sine', .05, 0, 520);
}
function startDay(d) {
  wake();
  day = d; hearts = 3; streak = 0; dayCoins = 0; missed = 0; spawned = 0; done = 0; spawnT = .5; closing = 0;
  N = cfg(d).n; monsters = []; drops = []; flies = []; emptyGlass(true);
  tipText = TIPS[Math.min(d, 7)]; tipT = 6;
  state = 'play'; $('menu').hidden = true; $('dayEnd').hidden = true; $('over').hidden = true; hud();
}
function endDay() {
  state = 'dayEnd';
  if (day + 1 > S.maxDay) S.maxDay = day + 1; save();
  const stars = Math.max(1, 3 - missed);
  $('endTitle').textContent = 'Day ' + day + ' done';
  $('stars').innerHTML = '★★★'.split('').map((s, i) => i < stars ? '<b>★</b>' : '★').join('');
  $('endLine').textContent = 'You earned ' + dayCoins + ' coins and served ' + (N - missed) + ' of ' + N + ' monsters.';
  $('endTip').innerHTML = '<small>Tomorrow</small>' + TIPS[Math.min(day + 1, 7)];
  $('dayEnd').hidden = false;
  [523, 659, 784, 1047].forEach((f, i) => tone(f, .2, 'triangle', .06, i * .1));
}
function gameOver() {
  state = 'over'; save();
  $('overLine').textContent = 'Day ' + day + ' got away from you. Your coins are safe: ' + S.coins + '. The recipe book can help.';
  $('over').hidden = false;
  tone(300, .25, 'sawtooth', .04, 0, 150); tone(200, .4, 'sawtooth', .04, .22, 90);
}
function hud() {
  $('day').textContent = day; $('coins').textContent = S.coins;
  $('hearts').innerHTML = [0, 1, 2].map(i => i < hearts ? '♥' : '<span class="off">♥</span>').join('');
}

// ---------- actions ----------
function emptyGlass(silent) {
  if (!silent && glass.seq.length) { tone(260, .18, 'sine', .05, 0, 120); for (let i = 0; i < 8; i++) parts.push({x:GL.x + rnd(-30, 30), y:GL.top + GL.h - 20, vx:rnd(-90, 90), vy:rnd(-160, -40), life:.5, c:css(glass.col), r:4}); }
  glass.R = glass.Y = glass.B = glass.W = 0; glass.seq = [];
}
function squirt(k) {
  if (state !== 'play' || paused) return;
  if (k === 'W' && day < 3) { deny = .3; tone(140, .12, 'square', .04); return; }
  press[k] = .18;
  if (glass.seq.length >= 4) { deny = .3; tone(140, .12, 'square', .04); floats.push({x:GL.x, y:GL.top - 6, txt:'Glass is full', col:PLUM, life:1, size:16}); return; }
  glass[k]++; glass.seq.push(k); glass.wob = 1;
  for (let i = 0; i < 5; i++) drops.push({x0:ING[k].x, y0:BTN_Y - 30, x1:GL.x + rnd(-14, 14), y1:GL.top + 20, t:-i * .03, c:css(ING[k].c)});
  tone(380 + glass.seq.length * 70, .1, 'sine', .07, 0, 520 + glass.seq.length * 70);
}
function serve(m) {
  if (state !== 'play' || paused || m.state !== 'wait') return;
  if (!glass.seq.length) { deny = .3; floats.push({x:m.x, y:CY - 150, txt:'Fill the glass first', col:PLUM, life:1.1, size:15}); tone(140, .12, 'square', .04); return; }
  const ok = keyOf(glass) === m.rec.key, col = mixColor(glass);
  flies.push({x0:GL.x, y0:GL.top + 40, m, t:0, ok, col});
  emptyGlass(true); tone(500, .12, 'sine', .05, 0, 800);
}
function land(f) {
  const m = f.m; if (m.state !== 'wait') return;
  if (f.ok) {
    m.state = 'happy'; m.t = 0; m.juice = f.col; streak++;
    const gain = 10 + Math.round(10 * m.pat / m.patMax) + Math.min(streak, 10) * 2;
    S.coins += gain; dayCoins += gain;
    if (!S.found.includes(m.rec.id)) { S.found.push(m.rec.id); floats.push({x:m.x, y:CY - 190, txt:'New recipe: ' + m.rec.name, col:'#7a3ff0', life:1.8, size:15}); }
    floats.push({x:m.x, y:CY - 160, txt:'+' + gain, col:'#e39a00', life:1.1, size:24});
    if (streak > 1) floats.push({x:GL.x, y:GL.top - 8, txt:streak + ' in a row!', col:'#ff5d8f', life:1.1, size:18});
    for (let i = 0; i < (reduced ? 3 : 9); i++) parts.push({x:m.x + rnd(-30, 30), y:CY - 90, vx:rnd(-70, 70), vy:rnd(-220, -90), life:rnd(.6, 1), c:'#ff5d8f', r:6, heart:1});
    [660, 880, 1100].forEach((q, i) => tone(q, .14, 'triangle', .06, i * .06));
    save(); hud();
  } else {
    m.yuck = .7; m.pat -= m.patMax * .22; m.frozen = false; streak = 0;
    floats.push({x:m.x, y:CY - 160, txt:'Yuck! Wrong colour', col:'#d0342c', life:1.2, size:16});
    tone(220, .25, 'sawtooth', .05, 0, 110);
  }
}

// ---------- update ----------
function update(dt) {
  T += dt;
  const target = mixColor(glass);
  if (target) glass.col = lerp(glass.col, target, Math.min(1, dt * 10));
  glass.level += (glass.seq.length / 4 - glass.level) * Math.min(1, dt * 9);
  glass.wob *= Math.pow(.02, dt);
  for (const k in press) press[k] = Math.max(0, press[k] - dt);
  deny = Math.max(0, deny - dt); tipT -= dt;
  for (const d of drops) d.t += dt * 3.2;
  drops = drops.filter(d => d.t < 1);
  for (const f of flies) { f.t += dt * 4.5; if (f.t >= 1) land(f); }
  flies = flies.filter(f => f.t < 1);
  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += (p.heart ? 120 : 520) * dt; p.life -= dt; }
  parts = parts.filter(p => p.life > 0);
  for (const f of floats) { f.y -= 34 * dt; f.life -= dt; }
  floats = floats.filter(f => f.life > 0);

  for (const m of monsters) {
    m.t += dt; m.yuck = Math.max(0, m.yuck - dt);
    m.blink -= dt; if (m.blink < -.12) m.blink = rnd(1.5, 4.5);
    if (m.state === 'in' && m.t > .45) { m.state = 'wait'; m.t = 0; }
    else if (m.state === 'wait' && state === 'play' && !m.frozen) {
      m.pat -= dt;
      if (m.pat <= 0) { m.state = 'angry'; m.t = 0; hearts--; missed++; streak = 0; hud(); tone(180, .3, 'square', .05, 0, 90);
        floats.push({x:m.x, y:CY - 160, txt:'Too slow!', col:'#d0342c', life:1.2, size:16}); }
    }
    else if (m.state === 'happy' && m.t > .95) { m.state = 'out'; m.t = 0; }
    else if (m.state === 'angry' && m.t > .8) { m.state = 'out'; m.t = 0; }
    else if (m.state === 'out' && m.t > .35) { m.gone = true; if (state === 'play') done++; }
  }
  monsters = monsters.filter(m => !m.gone);

  if (state === 'play') {
    spawnT -= dt;
    if (hearts <= 0) { closing += dt; if (closing > 1) gameOver(); }
    else if (spawned < N) { if (spawnT <= 0 || !monsters.length) spawn(); }
    else if (done >= N && !flies.length) endDay();
  } else if (state === 'menu') {
    if (monsters.length < 3 && Math.random() < dt * 1.5) {
      const free = [0, 1, 2].filter(i => !monsters.some(m => m.slot === i));
      const m = newMonster(pick(free), pick(RECIPES.slice(0, 12))); m.hint = false; m.frozen = true; monsters.push(m);
    }
  }
}

// ---------- drawing ----------
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function text(s, x, y, size, col, align, stroke) {
  ctx.font = '700 ' + size + 'px Fredoka, "Trebuchet MS", sans-serif'; ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle';
  if (stroke) { ctx.lineWidth = 4; ctx.strokeStyle = stroke; ctx.lineJoin = 'round'; ctx.strokeText(s, x, y); }
  ctx.fillStyle = col; ctx.fillText(s, x, y);
}
function glassPath(cx, top, h, wt, wb) { ctx.beginPath(); ctx.moveTo(cx - wt / 2, top); ctx.lineTo(cx - wb / 2, top + h - 8); ctx.quadraticCurveTo(cx - wb / 2, top + h, cx - wb / 2 + 8, top + h); ctx.lineTo(cx + wb / 2 - 8, top + h); ctx.quadraticCurveTo(cx + wb / 2, top + h, cx + wb / 2, top + h - 8); ctx.lineTo(cx + wt / 2, top); ctx.closePath(); }
function drawGlass(cx, top, h, wt, wb, level, col, wave, lw) {
  glassPath(cx, top, h, wt, wb); ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.fill();
  if (level > .01) {
    ctx.save(); glassPath(cx, top, h, wt, wb); ctx.clip();
    const y = top + h - level * (h - 10);
    ctx.beginPath(); ctx.moveTo(cx - wt, top + h + 4);
    for (let x = -wt / 2 - 4; x <= wt / 2 + 4; x += 6) ctx.lineTo(cx + x, y + Math.sin(x * .09 + T * 6) * wave);
    ctx.lineTo(cx + wt, top + h + 4); ctx.closePath(); ctx.fillStyle = css(col); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.22)'; ctx.fillRect(cx - wt / 2 + wt * .14, top, wt * .12, h);
    ctx.restore();
  }
  glassPath(cx, top, h, wt, wb); ctx.lineWidth = lw; ctx.strokeStyle = PLUM; ctx.lineJoin = 'round'; ctx.stroke();
}
function drawFruit(k, x, y, s) {
  ctx.lineWidth = 2.5; ctx.strokeStyle = PLUM; ctx.lineJoin = 'round';
  if (k === 'R') {
    ctx.beginPath(); ctx.moveTo(x, y + s); ctx.bezierCurveTo(x - s * 1.15, y + s * .2, x - s * .95, y - s * .85, x, y - s * .55); ctx.bezierCurveTo(x + s * .95, y - s * .85, x + s * 1.15, y + s * .2, x, y + s); ctx.fillStyle = css(ING.R.c); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ffe9a8'; [[-.35, -.1], [.35, -.1], [0, .25], [-.2, .5], [.25, .55], [0, -.25]].forEach(p => { ctx.beginPath(); ctx.arc(x + p[0] * s, y + p[1] * s, 1.8, 0, 6.3); ctx.fill(); });
    ctx.fillStyle = '#3fae5a'; [-.5, 0, .5].forEach(a => { ctx.beginPath(); ctx.ellipse(x + a * s * .7, y - s * .68, s * .32, s * .16, a * 1.1, 0, 6.3); ctx.fill(); ctx.stroke(); });
  } else if (k === 'Y') {
    ctx.save(); ctx.translate(x, y); ctx.rotate(-.45);
    ctx.beginPath(); ctx.ellipse(0, 0, s * 1.05, s * .76, 0, 0, 6.3); ctx.fillStyle = css(ING.Y.c); ctx.fill(); ctx.stroke();

// ---------- loop ----------
let last = 0;

// ---------- input ----------
function hit(e) {
  const r = cv.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * W, y = (e.clientY - r.top) / r.height * H;

  for (const k in ING) if (Math.hypot(x - ING[k].x, y - BTN_Y) < BTN_R + 8) return squirt(k);

$('play').onclick = () => startDay(S.maxDay);
