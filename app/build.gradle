plugins { id 'com.android.application' }

android {
    namespace 'com.zakgames.monsterjuicebar'
    compileSdk 36

    defaultConfig {
        applicationId 'com.zakgames.monsterjuicebar'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
