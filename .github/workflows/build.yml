name: Build Android app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Build bundle (.aab) and test app (.apk)
        run: chmod +x gradlew && ./gradlew --no-daemon bundleRelease assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: monster-juice-bar
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/debug/*.apk
      - name: Publish build files to the builds branch
        run: |
          mkdir out
          cp app/build/outputs/bundle/release/*.aab out/monster-juice-bar-unsigned.aab
          cp app/build/outputs/apk/debug/*.apk out/monster-juice-bar-test.apk
          cd out
          git init -q -b builds
          git add .
          git -c user.name="build" -c user.email="build@users.noreply.github.com" commit -qm "Build $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" builds
